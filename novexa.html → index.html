<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NOVEXA — Next Level Crypto Earning</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:#000;color:#9CA3AF;font-family:'DM Sans',sans-serif;overflow-x:hidden;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:#7C3AED;}

/* ═══ INTRO SPLASH ═══ */
#intro{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:#000;overflow:hidden;
  transition:opacity 1s ease,transform 1s ease;
}
#intro.exit{opacity:0;transform:scale(1.06);pointer-events:none;}
.i-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 80% at 50% 50%,#0a001f 0%,#000 75%);}
.i-hex{position:absolute;inset:0;background-image:repeating-linear-gradient(60deg,#7B2FFF08 0,#7B2FFF08 1px,transparent 1px,transparent 30px),repeating-linear-gradient(120deg,#7B2FFF08 0,#7B2FFF08 1px,transparent 1px,transparent 30px);}
.i-ring{position:absolute;border-radius:50%;border:1px solid transparent;animation:iSpin linear infinite;}
.ir1{width:82vmin;height:82vmin;border-top-color:#7B2FFF;border-right-color:#7B2FFF33;animation-duration:8s;}
.ir2{width:70vmin;height:70vmin;border-bottom-color:#00E5FF;border-left-color:#00E5FF33;animation-duration:12s;animation-direction:reverse;}
.ir3{width:58vmin;height:58vmin;border-top-color:#FF2D78;border-left-color:#FF2D7833;animation-duration:6s;}
@keyframes iSpin{to{transform:rotate(360deg)}}
.i-orb{position:absolute;border-radius:50%;filter:blur(55px);}
.io1{width:50vmin;height:50vmin;background:#7B2FFF22;top:50%;left:50%;transform:translate(-50%,-50%);animation:io1a 4s ease-in-out infinite;}
.io2{width:30vmin;height:30vmin;background:#00E5FF18;top:15%;left:10%;animation:io2a 5s 1s ease-in-out infinite;}
.io3{width:25vmin;height:25vmin;background:#FF2D7818;bottom:15%;right:10%;animation:io2a 5s 2.5s ease-in-out infinite;}
@keyframes io1a{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
@keyframes io2a{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.2)}}
.i-scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#00E5FF55 30%,#00E5FFaa 50%,#00E5FF55 70%,transparent);animation:iScanMove 5s linear infinite;pointer-events:none;}
@keyframes iScanMove{0%{top:0;opacity:0}5%{opacity:1}95%{opacity:1}100%{top:100%;opacity:0}}
.i-parts{position:absolute;inset:0;pointer-events:none;}
.i-part{position:absolute;border-radius:50%;animation:iPart linear infinite;}
@keyframes iPart{0%{opacity:0;transform:translateY(0) scale(0)}10%{opacity:1;transform:scale(1)}90%{opacity:.4}100%{opacity:0;transform:translateY(-100vh) scale(0)}}
.i-corner{position:absolute;width:clamp(24px,5vmin,48px);height:clamp(24px,5vmin,48px);}
.i-corner svg{width:100%;height:100%;}
.ctl{top:20px;left:20px;}
.ctr{top:20px;right:20px;transform:scaleX(-1);}
.cbl{bottom:20px;left:20px;transform:scaleY(-1);}
.cbr{bottom:20px;right:20px;transform:scale(-1);}
.i-data{position:absolute;font-family:'JetBrains Mono',monospace;font-size:clamp(6px,1.1vmin,10px);color:#7B2FFF44;letter-spacing:3px;writing-mode:vertical-lr;top:50%;transform:translateY(-50%);animation:iDataPulse 4s ease-in-out infinite;}
.id-l{left:20px;}.id-r{right:20px;transform:translateY(-50%) rotate(180deg);}
@keyframes iDataPulse{0%,100%{color:#7B2FFF33}50%{color:#7B2FFF88}}
.i-center{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,2vmin,18px);padding:0 20px;text-align:center;}
.i-diamond-wrap{width:clamp(50px,12vmin,90px);height:clamp(50px,12vmin,90px);position:relative;animation:iFloat 3s ease-in-out infinite;}
@keyframes iFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.i-diamond{position:absolute;top:50%;left:50%;width:58%;height:58%;transform:translate(-50%,-50%);clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);background:linear-gradient(135deg,#7B2FFF,#00E5FF);animation:iDGlow 2s ease-in-out infinite;}
@keyframes iDGlow{0%,100%{filter:drop-shadow(0 0 12px #7B2FFF)}50%{filter:drop-shadow(0 0 30px #00E5FF)}}
.i-diamond-inner{position:absolute;top:50%;left:50%;width:50%;height:50%;transform:translate(-50%,-50%);clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);background:linear-gradient(135deg,#00E5FF,#FF2D78);animation:iDHue 6s linear infinite;}
@keyframes iDHue{to{filter:hue-rotate(360deg)}}
.i-sep{display:flex;align-items:center;gap:10px;width:clamp(160px,50vmin,380px);}
.i-sep-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,#7B2FFF88,transparent);}
.i-sep-dot{width:5px;height:5px;background:#00E5FF;border-radius:50%;box-shadow:0 0 10px #00E5FF;animation:iDotPulse 2s ease-in-out infinite;}
@keyframes iDotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.8)}}
.i-brand{font-family:'Syne',sans-serif;font-weight:900;font-size:clamp(36px,11vmin,90px);letter-spacing:clamp(4px,2vmin,18px);background:linear-gradient(90deg,#7B2FFF 0%,#00E5FF 40%,#FF2D78 70%,#7B2FFF 100%);background-size:200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:iBrandShift 4s linear infinite;filter:drop-shadow(0 0 20px #7B2FFF88);white-space:nowrap;}
@keyframes iBrandShift{0%{background-position:0%}100%{background-position:200%}}
.i-tagline{font-family:'DM Sans',sans-serif;font-weight:300;font-size:clamp(8px,1.8vmin,13px);letter-spacing:clamp(4px,1.5vmin,10px);color:#00E5FF88;text-transform:uppercase;}
.i-btn{margin-top:clamp(18px,3.5vmin,36px);background:linear-gradient(135deg,#7B2FFF,#00E5FF);border:none;padding:clamp(12px,2vmin,18px) clamp(30px,6vmin,56px);font-family:'Syne',sans-serif;font-size:clamp(10px,1.8vmin,14px);font-weight:700;letter-spacing:3px;color:#fff;cursor:pointer;text-transform:uppercase;transition:all .3s;animation:iBtnGlow 2s ease-in-out infinite;}
@keyframes iBtnGlow{0%,100%{box-shadow:0 0 20px #7B2FFF66}50%{box-shadow:0 0 50px #7B2FFFcc,0 0 80px #00E5FF44}}
.i-btn:hover{transform:scale(1.07);}
.i-countdown{font-family:'JetBrains Mono',monospace;font-size:clamp(8px,1.2vmin,11px);color:#ffffff22;letter-spacing:2px;margin-top:10px;}
.i-countdown b{color:#00E5FF66;}

/* ═══ MAIN SITE ═══ */
:root{
  --v:#7C3AED;--v2:#A855F7;--v3:#C084FC;
  --gold:#F59E0B;--gold2:#FBBF24;--pink:#EC4899;
  --bg:#030305;--bg2:#06060A;--bg3:#0c0c14;--card:#0d0d18;
  --border:rgba(124,58,237,0.22);--border2:rgba(255,255,255,0.055);
  --text:#9CA3AF;--white:#F9FAFB;
}
#site{display:none;}

/* GRID BG */
#site::before{content:'';position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(124,58,237,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,.03) 1px,transparent 1px);background-size:55px 55px;pointer-events:none;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.8);backdrop-filter:blur(24px);border-bottom:1px solid var(--border2);}
.logo{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:900;letter-spacing:4px;color:#fff;position:relative;z-index:1;}
.logo em{color:transparent;background:linear-gradient(135deg,var(--v2),var(--pink));-webkit-background-clip:text;background-clip:text;font-style:normal;}
.logo-dot{display:inline-block;width:5px;height:5px;background:var(--gold);border-radius:50%;margin-left:2px;vertical-align:super;animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.nav-links{display:flex;gap:28px;list-style:none;}
.nav-links a{color:var(--text);text-decoration:none;font-size:.82rem;font-weight:500;letter-spacing:.5px;transition:color .2s;}
.nav-links a:hover{color:#fff;}
.nav-links a.gold{color:var(--gold);}
.nav-cta{background:linear-gradient(135deg,var(--v),var(--v2));border:none;padding:10px 26px;font-family:'Syne',sans-serif;font-size:.74rem;font-weight:700;letter-spacing:2px;color:#fff;cursor:pointer;transition:all .2s;}
.nav-cta:hover{opacity:.85;transform:translateY(-1px);}

/* HERO */
.hero{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:140px 5% 100px;overflow:hidden;}
.hero-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:700px;height:700px;background:radial-gradient(circle,rgba(124,58,237,.15) 0%,rgba(0,229,255,.06) 40%,transparent 70%);pointer-events:none;animation:hGlow 4s ease-in-out infinite;}
@keyframes hGlow{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.1)}}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.35);padding:7px 18px;border-radius:100px;font-size:.7rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--v3);margin-bottom:32px;animation:fadeUp .8s ease both;}
.badge-dot{width:6px;height:6px;background:var(--pink);border-radius:50%;animation:blink 1s infinite;}
h1.hero-title{font-family:'Syne',sans-serif;font-size:clamp(2.6rem,7vw,6rem);font-weight:900;line-height:.95;letter-spacing:-2px;color:#fff;margin-bottom:28px;animation:fadeUp .8s .1s ease both;}
.hero-title .grad{display:block;color:transparent;background:linear-gradient(135deg,var(--v2) 0%,var(--pink) 45%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;background-size:200%;animation:gradShift 3s ease infinite;}
@keyframes gradShift{0%,100%{background-position:0%}50%{background-position:100%}}
.hero-sub{font-size:1.05rem;line-height:1.8;color:var(--text);max-width:520px;margin:0 auto 44px;animation:fadeUp .8s .25s ease both;}
.hero-sub strong{color:#fff;font-weight:600;}
.hero-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;animation:fadeUp .8s .4s ease both;}
.btn-main{background:linear-gradient(135deg,var(--v),var(--v2));border:none;padding:15px 38px;font-family:'Syne',sans-serif;font-size:.8rem;font-weight:700;letter-spacing:2px;color:#fff;cursor:pointer;transition:all .25s;}
.btn-main:hover{opacity:.85;transform:translateY(-3px);box-shadow:0 14px 40px rgba(124,58,237,.45);}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.15);padding:15px 38px;font-family:'Syne',sans-serif;font-size:.8rem;font-weight:700;letter-spacing:2px;color:#fff;cursor:pointer;transition:all .25s;}
.btn-ghost:hover{border-color:var(--v2);background:rgba(124,58,237,.08);transform:translateY(-3px);}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

/* TICKER */
.ticker-wrap{position:relative;z-index:1;background:rgba(124,58,237,.05);border-top:1px solid var(--border);border-bottom:1px solid var(--border);overflow:hidden;display:flex;align-items:center;}
.ticker-lbl{background:linear-gradient(135deg,var(--v),var(--v2));padding:15px 22px;font-family:'Syne',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:2px;color:#fff;white-space:nowrap;flex-shrink:0;}
.ticker-track{overflow:hidden;flex:1;}
.ticker-inner{display:flex;width:max-content;animation:ticker 28s linear infinite;}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ti{padding:15px 36px;font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;color:var(--text);border-right:1px solid var(--border2);white-space:nowrap;}
.ti b{color:var(--gold);}

/* STATS */
.stats{position:relative;z-index:1;padding:70px 5%;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border2);border:1px solid var(--border2);max-width:900px;margin:0 auto;}
.stat{background:var(--bg2);padding:38px 20px;text-align:center;transition:background .3s;}
.stat:hover{background:var(--bg3);}
.stat-n{font-family:'JetBrains Mono',monospace;font-size:2.4rem;font-weight:700;display:block;margin-bottom:5px;line-height:1;}
.stat-n.gold{color:var(--gold);}
.stat-n.violet{color:var(--v3);}
.stat-n.pink{color:var(--pink);}
.stat-n.white{color:#fff;}
.stat-l{font-size:.7rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text);}

/* SECTIONS */
.sec{position:relative;z-index:1;padding:90px 5%;}
.sec.alt{background:rgba(255,255,255,.012);}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:.66rem;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--v3);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.eyebrow::before{content:'';width:20px;height:1px;background:var(--v2);}
.sec-title{font-family:'Syne',sans-serif;font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff;line-height:1.05;letter-spacing:-1px;margin-bottom:18px;}
.sec-title em{color:transparent;background:linear-gradient(135deg,var(--v2),var(--pink));-webkit-background-clip:text;background-clip:text;font-style:normal;}
.sec-title .ge{color:transparent;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;font-style:normal;}
.sec-sub{font-size:.98rem;line-height:1.8;color:var(--text);max-width:520px;margin-bottom:56px;}
.tc{text-align:center;}.tc .eyebrow{justify-content:center;}.tc .eyebrow::before{display:none;}.tc .sec-sub{margin-left:auto;margin-right:auto;}

/* PACKAGES */
.pkg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2px;background:var(--border2);max-width:860px;margin:0 auto;}
.pkg{background:var(--card);padding:44px 36px;position:relative;overflow:hidden;transition:transform .3s;}
.pkg:hover{transform:translateY(-5px);}
.pkg::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--v),transparent);}
.pkg.hot::before{background:linear-gradient(90deg,var(--v),var(--pink),var(--gold));}
.pkg-chip{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:4px 12px;border-radius:100px;margin-bottom:18px;}
.chip-s{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--gold);}
.chip-u{background:linear-gradient(135deg,var(--v),var(--pink));color:#fff;border:none;}
.pkg-price{font-family:'Syne',sans-serif;font-size:3.8rem;font-weight:900;color:#fff;line-height:1;letter-spacing:-2px;margin-bottom:4px;}
.pkg-price sup{font-size:1.4rem;color:var(--gold);vertical-align:super;}
.pkg-name{font-family:'JetBrains Mono',monospace;font-size:.66rem;font-weight:700;letter-spacing:3px;color:var(--v3);text-transform:uppercase;padding-bottom:24px;margin-bottom:28px;border-bottom:1px solid var(--border2);}
.pkg-list{list-style:none;margin-bottom:36px;}
.pkg-list li{padding:11px 0;font-size:.93rem;color:var(--text);display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid rgba(255,255,255,.03);}
.pkg-list li strong{color:#fff;font-weight:600;}
.pkg-list li .ic{flex-shrink:0;margin-top:2px;}
.pkg-tag{background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.2);padding:12px 16px;margin-bottom:28px;font-size:.86rem;font-weight:600;color:var(--v3);}
.btn-p{width:100%;padding:15px;font-family:'Syne',sans-serif;font-size:.76rem;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .25s;text-transform:uppercase;}
.btn-ps{background:transparent;border:1px solid rgba(255,255,255,.15);color:var(--text);}
.btn-ps:hover{border-color:var(--v2);color:#fff;background:rgba(124,58,237,.08);}
.btn-pu{background:linear-gradient(135deg,var(--v),var(--v2));border:none;color:#fff;}
.btn-pu:hover{opacity:.85;box-shadow:0 10px 36px rgba(124,58,237,.45);}

/* INCOME */
.inc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2px;background:var(--border2);}
.inc{background:var(--card);padding:32px 28px;transition:all .3s;position:relative;overflow:hidden;}
.inc:hover{transform:translateY(-3px);background:var(--bg3);}
.inc-n{font-family:'JetBrains Mono',monospace;font-size:2.8rem;font-weight:700;background:linear-gradient(135deg,var(--v2),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px;line-height:1;}
.inc-t{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;color:#fff;margin-bottom:10px;}
.inc-d{font-size:.86rem;line-height:1.65;color:var(--text);}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px;}
.tag{font-size:.6rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 9px;border-radius:100px;}
.tv{background:rgba(124,58,237,.12);color:var(--v3);border:1px solid rgba(124,58,237,.28);}
.tg{background:rgba(245,158,11,.1);color:var(--gold);border:1px solid rgba(245,158,11,.25);}
.tp{background:rgba(236,72,153,.1);color:var(--pink);border:1px solid rgba(236,72,153,.25);}

/* BINARY */
.bin-wrap{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;}
.bin-tree{display:flex;flex-direction:column;align-items:center;}
.bn{font-family:'JetBrains Mono',monospace;font-size:.65rem;font-weight:700;padding:12px 20px;text-align:center;min-width:130px;letter-spacing:1px;}
.bn-root{background:linear-gradient(135deg,var(--v),var(--v2));color:#fff;}
.bn-l{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);color:var(--gold);}
.bn-r{background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.35);color:var(--v3);}
.bn-sub{background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-size:.6rem;min-width:100px;padding:9px 14px;}
.bl{width:1px;height:28px;background:rgba(124,58,237,.3);}
.br{display:flex;gap:40px;position:relative;}
.br::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:160px;height:1px;background:rgba(124,58,237,.25);}
.bc{display:flex;flex-direction:column;align-items:center;}
.blbl{font-family:'JetBrains Mono',monospace;font-size:.58rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-top:6px;}
.ll{color:var(--gold);}.rl{color:var(--v3);}
.bin-badge{background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.25);padding:14px 22px;font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;color:var(--v3);text-align:center;margin-top:24px;animation:bbPulse 1.5s ease-in-out infinite;}
@keyframes bbPulse{0%,100%{box-shadow:0 0 0 rgba(124,58,237,0)}50%{box-shadow:0 0 18px rgba(124,58,237,.35)}}
.bin-info h3{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;color:#fff;letter-spacing:-1px;margin-bottom:28px;}
.bin-info h3 em{color:transparent;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;font-style:normal;}
.bin-rules{list-style:none;}
.bin-rule{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--border2);}
.rn{font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:700;color:#000;background:var(--v2);padding:3px 7px;flex-shrink:0;}
.rt{font-size:.9rem;color:var(--text);line-height:1.6;}
.rt strong{color:#fff;}

/* PAYOUT */
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--border2);}
.pay-box{background:var(--card);padding:36px;}
.pay-box h4{font-family:'Syne',sans-serif;font-size:.82rem;font-weight:700;color:var(--v3);letter-spacing:1px;margin-bottom:26px;line-height:1.5;}
.bar-row{margin-bottom:20px;}
.bar-lbl{display:flex;justify-content:space-between;font-size:.83rem;font-weight:500;margin-bottom:8px;}
.bar-lbl span:last-child{font-family:'JetBrains Mono',monospace;font-weight:700;}
.bar-track{height:7px;background:var(--bg3);}
.bar-fill{height:100%;}
.bv{background:linear-gradient(90deg,var(--v),var(--v2));width:80%;}
.bp{background:linear-gradient(90deg,var(--gold),var(--gold2));width:20%;}
.bg1{background:linear-
