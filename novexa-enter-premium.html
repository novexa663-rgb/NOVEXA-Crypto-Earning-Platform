<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NOVEXA Logo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  height:100vh;width:100vw;
  display:flex;justify-content:center;align-items:center;
  background:#000;overflow:hidden;font-family:Arial,sans-serif;
}

/* Deep space BG */
.bg{
  position:fixed;inset:0;
  background:radial-gradient(ellipse at 50% 30%,#1a0035 0%,#0a0018 50%,#000 100%);
  z-index:0;
}

/* Stars canvas */
canvas{position:fixed;inset:0;z-index:1;pointer-events:none;}

/* Main container */
.logo-container{
  position:relative;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;gap:0;
  animation:containerIn 1s cubic-bezier(0.34,1.56,0.64,1) both;
}

/* ── CIRCLE ── */
.circle-wrap{
  position:relative;
  width:clamp(180px,35vw,260px);
  height:clamp(180px,35vw,260px);
  display:flex;align-items:center;justify-content:center;
}

/* Outer spinning ring */
.ring-spin{
  position:absolute;inset:-6px;
  border-radius:50%;
  background:conic-gradient(
    #ff00cc,#ff4d00,#ffee00,#00ff99,#00ccff,#cc00ff,#ff00cc
  );
  animation:spinRing 4s linear infinite;
  filter:blur(1px);
}
.ring-spin::after{
  content:'';position:absolute;inset:4px;
  border-radius:50%;background:#000;
}

/* Second ring — counter spin */
.ring-spin2{
  position:absolute;inset:-14px;
  border-radius:50%;
  background:conic-gradient(
    transparent 60%,rgba(255,0,204,0.4) 70%,rgba(0,204,255,0.4) 85%,transparent 100%
  );
  animation:spinRing 6s linear infinite reverse;
}

/* Glow orb */
.glow-orb{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,rgba(180,0,255,0.25) 0%,transparent 70%);
  animation:glowPulse 3s ease-in-out infinite alternate;
}

/* Circle body */
.circle{
  width:100%;height:100%;
  border-radius:50%;
  position:relative;
  background:linear-gradient(135deg,#ff00cc,#ff6600,#ffee00,#00ff99,#00ccff);
  padding:4px;
  box-shadow:
    0 0 30px rgba(255,0,204,0.6),
    0 0 60px rgba(255,102,0,0.3),
    0 0 100px rgba(0,204,255,0.2);
  animation:glowPulse 3s ease-in-out infinite alternate;
}
.circle-inner{
  width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#1a0035,#000 70%);
  display:flex;align-items:center;justify-content:center;
}

/* N letter */
.n-logo{
  font-size:clamp(80px,15vw,140px);
  font-weight:900;
  background:linear-gradient(135deg,#ff00cc,#ff6600,#ffee00,#00ff99,#00ccff);
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:rainbowShift 3s linear infinite, nIn 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
  filter:drop-shadow(0 0 20px rgba(255,0,204,0.8));
  line-height:1;
}

/* Orbit dots */
.orbit{
  position:absolute;
  width:calc(100% + 40px);height:calc(100% + 40px);
  border-radius:50%;
  animation:spinRing 8s linear infinite;
  top:-20px;left:-20px;
}
.orbit-dot{
  position:absolute;
  width:8px;height:8px;border-radius:50%;
  top:0;left:50%;transform:translateX(-50%);
  box-shadow:0 0 10px currentColor;
}
.orbit-dot:nth-child(1){color:#ff00cc;background:#ff00cc;}
.orbit-dot:nth-child(2){
  color:#00ccff;background:#00ccff;
  top:auto;bottom:0;
  animation:none;
}

/* ── BRAND TEXT ── */
.brand{
  margin-top:clamp(16px,4vw,28px);
  font-size:clamp(2.5rem,10vw,5rem);
  font-weight:900;
  letter-spacing:0.18em;
  text-transform:uppercase;
  background:linear-gradient(90deg,
    #ff00cc,#ff4d00,#ffee00,#00ff99,#00ccff,#cc00ff,#ff00cc
  );
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:
    rainbowShift 3s linear infinite,
    brandIn 1s cubic-bezier(0.34,1.56,0.64,1) 0.5s both;
  filter:drop-shadow(0 0 16px rgba(255,0,204,0.5));
}

/* Reflection */
.brand-reflect{
  font-size:clamp(2.5rem,10vw,5rem);
  font-weight:900;letter-spacing:0.18em;text-transform:uppercase;
  background:linear-gradient(90deg,
    #ff00cc,#ff4d00,#ffee00,#00ff99,#00ccff,#cc00ff,#ff00cc
  );
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:rainbowShift 3s linear infinite;
  transform:scaleY(-1);
  opacity:0.15;filter:blur(3px);
  mask-image:linear-gradient(to bottom,rgba(0,0,0,0.5),transparent 70%);
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,0.5),transparent 70%);
  margin-top:-0.08em;line-height:1;
  animation:rainbowShift 3s linear infinite, fadeIn 1s ease 0.8s both;
}

/* Tagline */
.tagline{
  font-size:clamp(0.45rem,1.8vw,0.7rem);
  font-weight:600;letter-spacing:0.3em;
  color:rgba(255,255,255,0.3);
  text-transform:uppercase;
  margin-top:1rem;
  animation:fadeUp 0.8s ease 1s both;
}

/* ── Keyframes ── */
@keyframes spinRing{
  0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}
}
@keyframes glowPulse{
  from{box-shadow:0 0 20px rgba(255,0,204,0.5),0 0 50px rgba(255,102,0,0.2);}
  to{box-shadow:0 0 40px rgba(255,0,204,0.9),0 0 80px rgba(0,204,255,0.4),0 0 120px rgba(255,0,204,0.2);}
}
@keyframes rainbowShift{
  0%{background-position:0% center}100%{background-position:200% center}
}
@keyframes containerIn{
  from{opacity:0;transform:scale(0.7) translateY(20px)}
  to{opacity:1;transform:none}
}
@keyframes nIn{
  from{opacity:0;transform:scale(0.3) rotate(-20deg)}
  to{opacity:1;transform:none}
}
@keyframes brandIn{
  from{opacity:0;letter-spacing:0.5em}
  to{opacity:1;letter-spacing:0.18em}
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}
</style>
</head>
<body>

<div class="bg"></div>
<canvas id="c"></canvas>

<div class="logo-container">

  <!-- Circle with N -->
  <div class="circle-wrap">
    <div class="ring-spin2"></div>
    <div class="ring-spin"></div>
    <div class="glow-orb"></div>
    <div class="circle">
      <div class="circle-inner">
        <div class="n-logo">N</div>
      </div>
    </div>
    <div class="orbit">
      <div class="orbit-dot"></div>
      <div class="orbit-dot"></div>
    </div>
  </div>

  <!-- Brand name -->
  <div class="brand">NOVEXA</div>
  <div class="brand-reflect" aria-hidden="true">NOVEXA</div>
  <div class="tagline">✦ Next Level Crypto Earning ✦</div>

</div>

<script>
/* Particle stars */
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W,H;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

const cols=['#ff00cc','#ff4d00','#ffee00','#00ff99','#00ccff','#cc00ff','#fff','#fff'];
const stars=Array.from({length:250},()=>({
  x:Math.random()*3000,y:Math.random()*2000,
  r:Math.random()*1.8+0.1,
  a:Math.random(),da:(Math.random()-0.5)*0.015,
  col:cols[Math.floor(Math.random()*cols.length)]
}));

/* Shooting stars */
let shoots=[];
function addShoot(){
  if(Math.random()<0.3){
    shoots.push({
      x:Math.random()*W,y:Math.random()*H*0.5,
      len:Math.random()*80+40,
      speed:Math.random()*8+6,
      angle:Math.PI/4,
      a:1,
      col:cols[Math.floor(Math.random()*4)]
    });
  }
}
setInterval(addShoot,2000);

function draw(){
  ctx.clearRect(0,0,W,H);
  /* Static stars */
  stars.forEach(s=>{
    s.a+=s.da;
    if(s.a<=0||s.a>=1)s.da*=-1;
    ctx.save();
    ctx.globalAlpha=Math.max(0,Math.min(1,s.a))*0.8;
    ctx.fillStyle=s.col;
    ctx.beginPath();
    ctx.arc(s.x%W,s.y%H,s.r,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
  /* Shooting stars */
  shoots=shoots.filter(s=>s.a>0.05);
  shoots.forEach(s=>{
    ctx.save();
    ctx.globalAlpha=s.a;
    const grd=ctx.createLinearGradient(s.x,s.y,s.x-s.len*Math.cos(s.angle),s.y-s.len*Math.sin(s.angle));
    grd.addColorStop(0,s.col);
    grd.addColorStop(1,'transparent');
    ctx.strokeStyle=grd;
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(s.x,s.y);
    ctx.lineTo(s.x-s.len*Math.cos(s.angle),s.y-s.len*Math.sin(s.angle));
    ctx.stroke();
    ctx.restore();
    s.x+=s.speed*Math.cos(s.angle);
    s.y+=s.speed*Math.sin(s.angle);
    s.a-=0.025;
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
