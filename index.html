<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NOVEXA — Next Level Crypto Earning</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:#000;color:#9CA3AF;font-family:system-ui,sans-serif;overflow-x:hidden;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:#7C3AED;}

/* ═══ MAIN SITE ═══ */
:root{
  --v:#7C3AED;--v2:#A855F7;--v3:#C084FC;
  --gold:#F59E0B;--gold2:#FBBF24;--pink:#EC4899;
  --bg:#030305;--bg2:#06060A;--bg3:#0c0c14;--card:#0d0d18;
  --border:rgba(124,58,237,0.22);--border2:rgba(255,255,255,0.055);
  --text:#9CA3AF;--white:#F9FAFB;
}
#site{display:block;}

/* GRID BG */
#site::before{content:'';position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(124,58,237,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,.03) 1px,transparent 1px);background-size:55px 55px;pointer-events:none;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.8);backdrop-filter:blur(24px);border-bottom:1px solid var(--border2);}
.logo{font-family:system-ui,sans-serif;font-size:1.5rem;font-weight:900;letter-spacing:4px;color:#fff;position:relative;z-index:1;}
.logo em{color:transparent;background:linear-gradient(135deg,var(--v2),var(--pink));-webkit-background-clip:text;background-clip:text;font-style:normal;}
.logo-dot{display:inline-block;width:5px;height:5px;background:var(--gold);border-radius:50%;margin-left:2px;vertical-align:super;animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.nav-links{display:flex;gap:28px;list-style:none;}
.nav-links a{color:var(--text);text-decoration:none;font-size:.82rem;font-weight:500;letter-spacing:.5px;transition:color .2s;}
.nav-links a:hover{color:#fff;}
.nav-links a.gold{color:var(--gold);}
.nav-cta{background:linear-gradient(135deg,var(--v),var(--v2));border:none;padding:10px 26px;font-family:system-ui,sans-serif;font-size:.74rem;font-weight:700;letter-spacing:2px;color:#fff;cursor:pointer;transition:all .2s;}
.nav-cta:hover{opacity:.85;transform:translateY(-1px);}

/* HERO */
.hero{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:140px 5% 100px;overflow:hidden;}
.hero-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:700px;height:700px;background:radial-gradient(circle,rgba(124,58,237,.15) 0%,rgba(0,229,255,.06) 40%,transparent 70%);pointer-events:none;animation:hGlow 4s ease-in-out infinite;}
@keyframes hGlow{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.1)}}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.35);padding:7px 18px;border-radius:100px;font-size:.7rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--v3);margin-bottom:32px;animation:fadeUp .8s ease both;}
.badge-dot{width:6px;height:6px;background:var(--pink);border-radius:50%;animation:blink 1s infinite;}
h1.hero-title{font-family:system-ui,sans-serif;font-size:clamp(2.6rem,7vw,6rem);font-weight:900;line-height:.95;letter-spacing:-2px;color:#fff;margin-bottom:28px;animation:fadeUp .8s .1s ease both;}
.hero-title .grad{display:block;color:transparent;background:linear-gradient(135deg,var(--v2) 0%,var(--pink) 45%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;background-size:200%;animation:gradShift 3s ease infinite;}
@keyframes gradShift{0%,100%{background-position:0%}50%{background-position:100%}}
.hero-sub{font-size:1.05rem;line-height:1.8;color:var(--text);max-width:520px;margin:0 auto 44px;animation:fadeUp .8s .25s ease both;}
.hero-sub strong{color:#fff;font-weight:600;}
.hero-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;animation:fadeUp .8s .4s ease both;}
.btn-main{background:linear-gradient(135deg,var(--v),var(--v2));border:none;padding:15px 38px;font-family:system-ui,sans-serif;font-size:.8rem;font-weight:700;letter-spacing:2px;color:#fff;cursor:pointer;transition:all .25s;}
.btn-main:hover{opacity:.85;transform:translateY(-3px);box-shadow:0 14px 40px rgba(124,58,237,.45);}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.15);padding:15px 38px;font-family:system-ui,sans-serif;font-size:.8rem;font-weight:700;letter-spacing:2px;color:#fff;cursor:pointer;transition:all .25s;}
.btn-ghost:hover{border-color:var(--v2);background:rgba(124,58,237,.08);transform:translateY(-3px);}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

/* TICKER */
.ticker-wrap{position:relative;z-index:1;background:rgba(124,58,237,.05);border-top:1px solid var(--border);border-bottom:1px solid var(--border);overflow:hidden;display:flex;align-items:center;}
.ticker-lbl{background:linear-gradient(135deg,var(--v),var(--v2));padding:15px 22px;font-family:system-ui,sans-serif;font-size:.68rem;font-weight:700;letter-spacing:2px;color:#fff;white-space:nowrap;flex-shrink:0;}
.ticker-track{overflow:hidden;flex:1;}
.ticker-inner{display:flex;width:max-content;animation:ticker 28s linear infinite;}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ti{padding:15px 36px;font-family:monospace;font-size:.7rem;font-weight:700;color:var(--text);border-right:1px solid var(--border2);white-space:nowrap;}
.ti b{color:var(--gold);}

/* STATS */
.stats{position:relative;z-index:1;padding:70px 5%;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border2);border:1px solid var(--border2);max-width:900px;margin:0 auto;}
.stat{background:var(--bg2);padding:38px 20px;text-align:center;transition:background .3s;}
.stat:hover{background:var(--bg3);}
.stat-n{font-family:monospace;font-size:2.4rem;font-weight:700;display:block;margin-bottom:5px;line-height:1;}
.stat-n.gold{color:var(--gold);}
.stat-n.violet{color:var(--v3);}
.stat-n.pink{color:var(--pink);}
.stat-n.white{color:#fff;}
.stat-l{font-size:.7rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text);}

/* SECTIONS */
.sec{position:relative;z-index:1;padding:90px 5%;}
.sec.alt{background:rgba(255,255,255,.012);}
.eyebrow{font-family:monospace;font-size:.66rem;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--v3);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.eyebrow::before{content:'';width:20px;height:1px;background:var(--v2);}
.sec-title{font-family:system-ui,sans-serif;font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff;line-height:1.05;letter-spacing:-1px;margin-bottom:18px;}
.sec-title em{color:transparent;background:linear-gradient(135deg,var(--v2),var(--pink));-webkit-background-clip:text;background-clip:text;font-style:normal;}
.sec-title .ge{color:transparent;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;font-style:normal;}
.sec-sub{font-size:.98rem;line-height:1.8;color:var(--text);max-width:520px;margin-bottom:56px;}
.tc{text-align:center;}.tc .eyebrow{justify-content:center;}.tc .eyebrow::before{display:none;}.tc .sec-sub{margin-left:auto;margin-right:auto;}

/* PACKAGES */
.pkg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2px;background:var(--border2);max-width:860px;margin:0 auto;}
.pkg{background:var(--card);padding:44px 36px;position:relative;overflow:hidden;transition:transform .3s;}
.pkg:hover{transform:translateY(-5px);}
.pkg::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--v),transparent);}
.pkg.hot::before{background:linear-gradient(90deg,var(--v),var(--pink),var(--gold));}
.pkg-chip{display:inline-block;font-family:monospace;font-size:.6rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:4px 12px;border-radius:100px;margin-bottom:18px;}
.chip-s{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--gold);}
.chip-u{background:linear-gradient(135deg,var(--v),var(--pink));color:#fff;border:none;}
.pkg-price{font-family:system-ui,sans-serif;font-size:3.8rem;font-weight:900;color:#fff;line-height:1;letter-spacing:-2px;margin-bottom:4px;}
.pkg-price sup{font-size:1.4rem;color:var(--gold);vertical-align:super;}
.pkg-name{font-family:monospace;font-size:.66rem;font-weight:700;letter-spacing:3px;color:var(--v3);text-transform:uppercase;padding-bottom:24px;margin-bottom:28px;border-bottom:1px solid var(--border2);}
.pkg-list{list-style:none;margin-bottom:36px;}
.pkg-list li{padding:11px 0;font-size:.93rem;color:var(--text);display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid rgba(255,255,255,.03);}
.pkg-list li strong{color:#fff;font-weight:600;}
.pkg-list li .ic{flex-shrink:0;margin-top:2px;}
.pkg-tag{background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.2);padding:12px 16px;margin-bottom:28px;font-size:.86rem;font-weight:600;color:var(--v3);}
.btn-p{width:100%;padding:15px;font-family:system-ui,sans-serif;font-size:.76rem;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .25s;text-transform:uppercase;}
.btn-ps{background:transparent;border:1px solid rgba(255,255,255,.15);color:var(--text);}
.btn-ps:hover{border-color:var(--v2);color:#fff;background:rgba(124,58,237,.08);}
.btn-pu{background:linear-gradient(135deg,var(--v),var(--v2));border:none;color:#fff;}
.btn-pu:hover{opacity:.85;box-shadow:0 10px 36px rgba(124,58,237,.45);}

/* INCOME */
.inc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2px;background:var(--border2);}
.inc{background:var(--card);padding:32px 28px;transition:all .3s;position:relative;overflow:hidden;}
.inc:hover{transform:translateY(-3px);background:var(--bg3);}
.inc-n{font-family:monospace;font-size:2.8rem;font-weight:700;background:linear-gradient(135deg,var(--v2),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px;line-height:1;}
.inc-t{font-family:system-ui,sans-serif;font-size:1rem;font-weight:700;color:#fff;margin-bottom:10px;}
.inc-d{font-size:.86rem;line-height:1.65;color:var(--text);}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px;}
.tag{font-size:.6rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 9px;border-radius:100px;}
.tv{background:rgba(124,58,237,.12);color:var(--v3);border:1px solid rgba(124,58,237,.28);}
.tg{background:rgba(245,158,11,.1);color:var(--gold);border:1px solid rgba(245,158,11,.25);}
.tp{background:rgba(236,72,153,.1);color:var(--pink);border:1px solid rgba(236,72,153,.25);}

/* BINARY */
.bin-wrap{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;}
.bin-tree{display:flex;flex-direction:column;align-items:center;}
.bn{font-family:monospace;font-size:.65rem;font-weight:700;padding:12px 20px;text-align:center;min-width:130px;letter-spacing:1px;}
.bn-root{background:linear-gradient(135deg,var(--v),var(--v2));color:#fff;}
.bn-l{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);color:var(--gold);}
.bn-r{background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.35);color:var(--v3);}
.bn-sub{background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-size:.6rem;min-width:100px;padding:9px 14px;}
.bl{width:1px;height:28px;background:rgba(124,58,237,.3);}
.br{display:flex;gap:40px;position:relative;}
.br::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:160px;height:1px;background:rgba(124,58,237,.25);}
.bc{display:flex;flex-direction:column;align-items:center;}
.blbl{font-family:monospace;font-size:.58rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-top:6px;}
.ll{color:var(--gold);}.rl{color:var(--v3);}
.bin-badge{background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.25);padding:14px 22px;font-family:monospace;font-size:.68rem;font-weight:700;color:var(--v3);text-align:center;margin-top:24px;animation:bbPulse 1.5s ease-in-out infinite;}
@keyframes bbPulse{0%,100%{box-shadow:0 0 0 rgba(124,58,237,0)}50%{box-shadow:0 0 18px rgba(124,58,237,.35)}}
.bin-info h3{font-family:system-ui,sans-serif;font-size:1.8rem;font-weight:800;color:#fff;letter-spacing:-1px;margin-bottom:28px;}
.bin-info h3 em{color:transparent;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;font-style:normal;}
.bin-rules{list-style:none;}
.bin-rule{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--border2);}
.rn{font-family:monospace;font-size:.62rem;font-weight:700;color:#000;background:var(--v2);padding:3px 7px;flex-shrink:0;}
.rt{font-size:.9rem;color:var(--text);line-height:1.6;}
.rt strong{color:#fff;}

/* PAYOUT */
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--border2);}
.pay-box{background:var(--card);padding:36px;}
.pay-box h4{font-family:system-ui,sans-serif;font-size:.82rem;font-weight:700;color:var(--v3);letter-spacing:1px;margin-bottom:26px;line-height:1.5;}
.bar-row{margin-bottom:20px;}
.bar-lbl{display:flex;justify-content:space-between;font-size:.83rem;font-weight:500;margin-bottom:8px;}
.bar-lbl span:last-child{font-family:monospace;font-weight:700;}
.bar-track{height:7px;background:var(--bg3);}
.bar-fill{height:100%;}
.bv{background:linear-gradient(90deg,var(--v),var(--v2));width:80%;}
.bp{background:linear-gradient(90deg,var(--gold),var(--gold2));width:20%;}
.bg1{background:linear-gradient(90deg,var(--gold),var(--gold2));width:50%;}
.bg2{background:linear-gradient(90deg,#f0b90b,#fcd535);width:50%;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
.chip-c{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);padding:5px 13px;font-size:.73rem;font-weight:600;color:#fff;}
.cdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.dv{background:var(--v2);}.dg{background:var(--gold);}.dp{background:var(--pink);}.db{background:#f0b90b;}

/* WITHDRAWAL */
.wd-wrap{background:var(--card);border:1px solid var(--border2);max-width:820px;margin:0 auto;overflow:hidden;}
.wd-top{display:grid;grid-template-columns:repeat(3,1fr);}
.wd-st{padding:40px 24px;text-align:center;position:relative;}
.wd-st+.wd-st::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:1px;background:var(--border2);}
.wd-n{font-family:monospace;font-size:2.4rem;font-weight:700;color:#fff;display:block;margin-bottom:5px;line-height:1;}
.wd-l{font-size:.68rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text);}
.wd-bot{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border2);}
.wd-sec{padding:32px 36px;}
.wd-sec+.wd-sec{border-left:1px solid var(--border2);}
.wd-h{font-family:monospace;font-size:.62rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--v3);margin-bottom:14px;}
.wd-t{font-size:.9rem;line-height:1.7;color:var(--text);}
.wd-t strong{color:#fff;}

/* HOW */
.how-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--border2);border:1px solid var(--border2);}
.how-step{background:var(--card);padding:44px 28px;transition:background .3s;position:relative;}
.how-step:hover{background:var(--bg3);}
.how-step+.how-step::before{content:'';position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--border2);}
.how-n{font-family:monospace;font-size:.62rem;font-weight:700;color:var(--v3);letter-spacing:3px;display:flex;align-items:center;gap:8px;margin-bottom:22px;}
.how-n::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--border),transparent);}
.how-icon{font-size:2rem;margin-bottom:18px;display:block;}
.how-t{font-family:system-ui,sans-serif;font-size:1rem;font-weight:700;color:#fff;margin-bottom:10px;}
.how-d{font-size:.84rem;line-height:1.65;color:var(--text);}

/* VIDEO TUTORIAL */
.vtut-player{background:#07040f;border:1px solid rgba(168,85,247,.35);overflow:hidden;max-width:860px;margin:0 auto;box-shadow:0 0 60px rgba(124,58,237,.15);}
.vtut-header{display:flex;align-items:center;gap:8px;padding:11px 18px;background:rgba(0,0,0,.6);border-bottom:1px solid rgba(255,255,255,.05);}
.vdot{width:10px;height:10px;border-radius:50%;}
.vdot.r{background:#EC4899;}.vdot.y{background:#F59E0B;}.vdot.g{background:#10B981;}
.vtut-title{font-family:monospace;font-size:.62rem;font-weight:700;letter-spacing:3px;color:rgba(168,85,247,.55);margin:0 auto;}
.vtut-screen{position:relative;height:420px;overflow:hidden;cursor:pointer;background:#07040f;}
.vscene{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;padding:24px 32px 72px;}
.vscene.act{display:flex!important;}
.sc-bg{position:absolute;inset:0;}
.sc-bg::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(168,85,247,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(168,85,247,.03) 1px,transparent 1px);background-size:38px 38px;}
.sbg1{background:radial-gradient(ellipse at 30% 40%,rgba(124,58,237,.2),transparent 55%),radial-gradient(ellipse at 70% 60%,rgba(236,72,153,.1),transparent 50%),#07040f;}
.sbg2{background:radial-gradient(ellipse at 20% 50%,rgba(245,158,11,.12),transparent 50%),radial-gradient(ellipse at 80% 50%,rgba(124,58,237,.15),transparent 50%),#06040f;}
.sbg3{background:radial-gradient(ellipse at 50% 30%,rgba(16,185,129,.1),transparent 55%),radial-gradient(ellipse at 50% 70%,rgba(124,58,237,.15),transparent 55%),#04080f;}
.sbg4{background:radial-gradient(ellipse at 50% 50%,rgba(245,158,11,.16),transparent 60%),#060407;}
.sc-inner{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:center;gap:36px;width:100%;height:100%;}
.char{flex-shrink:0;display:flex;align-items:flex-end;}
.char svg{height:190px;overflow:visible;filter:drop-shadow(0 0 18px rgba(168,85,247,.3));animation:charBob 2s ease-in-out infinite;}
@keyframes charBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.sc-vis{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
/* Scene 1 */
.s1logo{font-family:system-ui,sans-serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:900;letter-spacing:5px;color:transparent;background:linear-gradient(135deg,#A855F7,#EC4899,#F59E0B);-webkit-background-clip:text;background-clip:text;animation:logoPulse 2s ease-in-out infinite;text-align:center;}
@keyframes logoPulse{0%,100%{filter:drop-shadow(0 0 16px rgba(168,85,247,.8))}50%{filter:drop-shadow(0 0 36px rgba(236,72,153,.9))}}
.s1tag{font-family:monospace;font-size:.62rem;letter-spacing:4px;color:var(--v3);text-align:center;text-transform:uppercase;}
.s1coins{display:flex;gap:12px;margin-top:6px;}
.s1c{font-size:1.7rem;animation:coinSpin 3s linear infinite;}
@keyframes coinSpin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.s1c:nth-child(2){animation-delay:.5s;}.s1c:nth-child(3){animation-delay:1s;}
/* Scene 2 */
.mini-cards{display:flex;gap:14px;align-items:center;}
.mc{background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.3);padding:16px 20px;text-align:center;min-width:106px;animation:cardPop .5s ease both;}
.mc.gc{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.06);animation-delay:.3s;}
@keyframes cardPop{from{transform:scale(.4) translateY(30px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.mc-price{font-family:system-ui,sans-serif;font-size:1.7rem;font-weight:900;color:#fff;line-height:1;}
.mc-price sup{font-size:.85rem;color:var(--gold);}
.mc-name{font-family:monospace;font-size:.54rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--v3);margin-bottom:6px;}
.mc-tag{font-size:.68rem;color:var(--text);}
.
